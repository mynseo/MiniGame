<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MiniGame</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #1b1d21; color: #f2f2f2;
         font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  main { width: min(420px, 90vw); }
  h1 { margin: 0 0 16px; }
  a.game { display: block; padding: 16px; border-radius: 12px; background: #262a30; border: 2px solid #3d434b;
           color: inherit; text-decoration: none; margin-bottom: 12px; }
  a.game:hover { border-color: #ffcc33; }
  a.game b { font-size: 18px; }
  a.game span { display: block; font-size: 14px; opacity: .75; margin-top: 4px; }
</style>
</head>
<body>
<main>
  <h1>🎮 MiniGame</h1>
  <a class="game" href="elevator/">
    <b>🛗 닫힘 버튼 연타</b>
    <span>누가 타기 전에 엘리베이터 문을 닫아라!</span>
  </a>
</main>
</body>
</html>
