<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>갈매기 돛대</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Dodum&display=swap">
<style>
/* Layout: full-bleed canvas world; signal-flag UI floats over it, HUD top, hand pads bottom, cards centered */
:root {
  --navy: #13233f;
  --navy-glass: rgba(19, 35, 63, 0.86);
  --flag-yellow: #f2c230;
  --flag-red: #d8432e;
  --foam: #f4f6fa;
  --rope: #c9a46a;
  --display: "Black Han Sans", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; overflow: hidden; }
body {
  background: var(--navy);
  color: var(--foam);
  font-family: var(--body);
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
}
#c { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
#ui {
  position: fixed; inset: 0; pointer-events: none;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: calc(env(safe-area-inset-top, 0px) + 14px) calc(env(safe-area-inset-bottom, 0px) + 14px);
  display: grid; grid-template-rows: auto 1fr auto;
}
#hud { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; transition: opacity .3s; }
#alt { font-family: var(--display); font-size: clamp(34px, 9vw, 56px); line-height: 1; letter-spacing: .01em;
  font-variant-numeric: tabular-nums; text-shadow: 0 2px 0 var(--navy), 0 0 14px rgba(19,35,63,.45); }
#zone { margin-top: 6px; font-size: 13px; letter-spacing: .08em; display: inline-block;
  background: var(--flag-yellow); color: var(--navy); padding: 3px 8px; border-radius: 3px; font-weight: 700; }
.right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
#best { font-size: 14px; font-variant-numeric: tabular-nums; text-shadow: 0 1px 2px var(--navy); }
#mute { pointer-events: auto; font: inherit; font-size: 13px; color: var(--foam); background: var(--navy-glass);
  border: 1px solid rgba(244,246,250,.25); border-radius: 999px; padding: 6px 12px; cursor: pointer; }
#mute:focus-visible, #again:focus-visible { outline: 3px solid var(--flag-yellow); outline-offset: 2px; }
#mid { display: grid; place-items: center; position: relative; }
.card { pointer-events: none; background: var(--navy-glass); border-radius: 6px; padding: 22px 22px 20px;
  width: min(360px, 100%); border-top: 6px solid var(--flag-red); box-shadow: 0 12px 40px rgba(0,0,0,.35); }
.card h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 40px; line-height: 1.05; text-wrap: balance; }
.card h1 span { color: var(--flag-yellow); }
.card .lead { margin: 8px 0 14px; font-size: 15px; opacity: .9; }
.rules { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; font-size: 14px; line-height: 1.45; }
.rules li { display: grid; grid-template-columns: 22px 1fr; gap: 8px; align-items: start; }
.rules b { font-family: var(--display); font-weight: 400; color: var(--navy); background: var(--flag-yellow);
  border-radius: 3px; text-align: center; font-size: 13px; line-height: 20px; }
.cta { margin-top: 16px; font-family: var(--display); font-size: 18px; color: var(--flag-yellow); animation: blink 1.2s ease-in-out infinite; }
.back { pointer-events: auto; display: block; margin-top: 12px; text-align: center; color: var(--foam); opacity: .85; font-size: 14px; }
@keyframes blink { 50% { opacity: .35; } }
#res .lab { font-size: 13px; letter-spacing: .1em; opacity: .8; }
#rscore { font-family: var(--display); font-size: 60px; line-height: 1; color: var(--flag-yellow); font-variant-numeric: tabular-nums; }
#rtitle { font-family: var(--display); font-size: 22px; margin-top: 10px; }
#rcom { font-size: 14px; opacity: .85; margin-top: 4px; }
.facts { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 12px; font-size: 13px; font-variant-numeric: tabular-nums; }
.facts span { opacity: .9; }
#rbest.new { color: var(--flag-yellow); font-weight: 700; }
#again { pointer-events: auto; margin-top: 16px; width: 100%; font-family: var(--display); font-size: 20px;
  color: var(--navy); background: var(--flag-yellow); border: 0; border-radius: 4px; padding: 12px; cursor: pointer; }
#res { pointer-events: auto; }
#pop { position: absolute; top: 18%; left: 0; right: 0; text-align: center; font-family: var(--display);
  font-size: clamp(26px, 7vw, 40px); color: var(--flag-yellow); text-shadow: 0 3px 0 var(--navy); opacity: 0; }
#pop.show { animation: pop 1.4s ease-out forwards; }
@keyframes pop { 0% { opacity: 0; transform: scale(.7); } 12% { opacity: 1; transform: scale(1.06); } 22% { transform: scale(1); } 75% { opacity: 1; } 100% { opacity: 0; transform: translateY(-14px); } }
#hint { position: absolute; bottom: 8%; left: 0; right: 0; text-align: center; font-size: 17px; font-weight: 700;
  color: var(--navy); opacity: 0; transition: opacity .2s; }
#hint span { background: var(--flag-yellow); padding: 6px 12px; border-radius: 4px; }
#pads { display: flex; justify-content: space-between; gap: 12px; transition: opacity .3s; }
.pad { font-size: 13px; letter-spacing: .06em; padding: 8px 14px; border-radius: 999px; background: var(--navy-glass);
  border: 1px solid rgba(244,246,250,.2); transition: background .12s, color .12s, transform .12s; }
.pad.hit { background: var(--flag-yellow); color: var(--navy); transform: scale(1.06); }
.pad.want { background: var(--flag-red); color: var(--foam); }
@media (prefers-reduced-motion: reduce) { .cta { animation: none; } #pop.show { animation-duration: .01s; opacity: 1; } }
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>


<canvas id="c" aria-label="갈매기 돛대 게임 화면"></canvas>
<div id="ui">
  <div id="hud">
    <div>
      <div id="alt">0.0m</div>
      <div id="zone">갑판</div>
    </div>
    <div class="right">
      <button id="mute" type="button">소리 켜짐</button>
      <div id="best">최고 0.0m</div>
    </div>
  </div>
  <div id="mid">
    <div class="card" id="intro">
      <h1>갈매기 <span>돛대</span></h1>
      <p class="lead">흔들리는 배 위, 끝없이 높은 돛대를 맨손으로 오릅니다.</p>
      <ul class="rules">
        <li><b>1</b><span>화면 왼쪽·오른쪽을 <strong>번갈아</strong> 누르면 한 칸씩 올라갑니다.</span></li>
        <li><b>2</b><span>누른 쪽으로 돛대가 휩니다. 8m쯤부터는 가만히 둬도 쓰러지니, 기운 반대쪽을 눌러 버티세요.</span></li>
        <li><b>3</b><span>갈매기가 어깨에 앉으면 그쪽이 무거워집니다. 그쪽을 빠르게 두 번 누르면 쫓아낼 수 있어요.</span></li>
      </ul>
      <div class="cta">아무 곳이나 눌러 출항</div>
      <a class="back" href="../index.html">← 게임 목록</a>
    </div>
    <div class="card" id="res" hidden>
      <div class="lab">오른 높이</div>
      <div id="rscore">0m</div>
      <div id="rtitle"></div>
      <div id="rcom"></div>
      <div class="facts"><span id="rfly"></span><span id="rbest"></span></div>
      <button id="again" type="button">다시 오르기</button>
      <a class="back" href="../index.html">← 게임 목록</a>
    </div>
    <div id="pop"></div>
    <div id="hint"><span>기운 반대쪽을 눌러 버텨요</span></div>
  </div>
  <div id="pads"><div class="pad" id="padL">◀ 왼손 (A, ←)</div><div class="pad" id="padR">오른손 (D, →) ▶</div></div>
</div>

<script>
(() => {
const $ = id => document.getElementById(id);
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const fmt = v => (v < 10 ? v.toFixed(1) : Math.round(v)) + 'm';

// ---- tuning ----
const C = { STEP: 0.6, KICK: 0.30, JIT: 0.14, DAMP: 0.4, FAIL: 1.05, IDLE: 0.75, MAX_H: 150 };
const stiff = h => 55 / (1 + h / 3.5);            // mast springing back upright, weakens with height
const topple = h => 210 / (h + 5) + 0.1 * h;      // your weight pulling it over; overtakes stiffness near 8m
const SWELL_T = 3.8;
const ZONES = [
  { h: 0, name: '갑판' }, { h: 8, name: '돛 활대' }, { h: 20, name: '망대' }, { h: 35, name: '구름층' },
  { h: 60, name: '폭풍층' }, { h: 90, name: '오로라' }, { h: 130, name: '우주' }
];
const RANKS = [
  { h: 0, t: '갑판 청소 담당', c: '번갈아 누르는 리듬부터 익혀 봐요.' },
  { h: 8, t: '돛 수선공', c: '8m쯤부터 돛대가 스스로 쓰러지려 해요. 기울면 반대쪽!' },
  { h: 20, t: '망대 파수꾼', c: '갈매기가 앉으면 그쪽을 빠르게 두 번 눌러 쫓아요.' },
  { h: 35, t: '구름 위 항해사', c: '선장이 콩알만 하게 보였다.' },
  { h: 60, t: '폭풍을 뚫은 선원', c: '번개보다 돛대가 더 무서웠다.' },
  { h: 90, t: '오로라 선장', c: '북쪽 항로가 한눈에 보였다.' },
  { h: 130, t: '별을 낚은 선원', c: '돛대 끝에서 별자리를 고쳐 달았다.' }
];

// ---- canvas ----
const cv = $('c'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, ppm = 30;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ppm = Math.max(22, Math.min(W, H) / 12);
}
addEventListener('resize', resize); resize();

// seeded scenery so it doesn't reshuffle every run
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const R = mulberry(7);
const clouds = [];
for (let i = 0; i < 22; i++) clouds.push({ x: -60 + R() * 120, y: 30 + R() * 26, s: 1.5 + R() * 2.5, dark: false });
for (let i = 0; i < 18; i++) clouds.push({ x: -60 + R() * 120, y: 60 + R() * 26, s: 2 + R() * 3, dark: true });
const stars = [];
for (let i = 0; i < 140; i++) stars.push({ x: R(), y: R(), r: 0.5 + R() * 1.3, p: R() * 6 });

// ---- state ----
let st = 'ready', t = 0;
let h, hv, maxH, th, om, lastSide, idle, slideV, gust, gustT, gustTarget, gull, gullT, hinted, hint, hintSide;
let zoneIdx, roll, flyer, resT, flash, flashT, creakT, topped, camX = 0, camY = 4;
let grab = [0, 0];
let parts = [];
let best = 0;
try { best = +localStorage.getItem('gull-mast-best') || 0; } catch (e) {}

function reset() {
  h = 0; hv = 0; maxH = 0; th = 0; om = 0; lastSide = 0; idle = 0; slideV = 0;
  gust = 0; gustT = 0; gustTarget = 0; gull = null; gullT = rand(4, 7);
  hinted = false; hint = 0; hintSide = 1; zoneIdx = 0; roll = 0; flyer = null; resT = 0;
  flash = 0; flashT = rand(2, 5); creakT = 0; topped = false; parts = [];
}
reset();

// ---- audio ----
let AC = null, master = null, muted = false;
try { muted = localStorage.getItem('gull-mast-muted') === '1'; } catch (e) {}
function ensureAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = muted ? 0 : 0.5; master.connect(AC.destination);
  } catch (e) { AC = null; }
}
function tone(f, d, type = 'sine', g = 0.2, f2) {
  if (!AC) return;
  const o = AC.createOscillator(), a = AC.createGain(), n = AC.currentTime;
  o.type = type; o.frequency.setValueAtTime(f, n);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, n + d);
  a.gain.setValueAtTime(g, n); a.gain.exponentialRampToValueAtTime(0.0001, n + d);
  o.connect(a); a.connect(master); o.start(n); o.stop(n + d + 0.02);
}
function noise(d, g, fc) {
  if (!AC) return;
  const n = AC.currentTime, len = Math.floor(AC.sampleRate * d);
  const buf = AC.createBuffer(1, len, AC.sampleRate), ch = buf.getChannelData(0);
  for (let i = 0; i < len; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const src = AC.createBufferSource(), f = AC.createBiquadFilter(), a = AC.createGain();
  src.buffer = buf; f.type = 'lowpass'; f.frequency.value = fc; a.gain.value = g;
  src.connect(f); f.connect(a); a.connect(master); src.start(n);
}
const sfx = {
  step: () => tone(200 + Math.random() * 50, 0.06, 'triangle', 0.12),
  creak: m => tone(80 + m * 50, 0.3, 'sawtooth', 0.035, 55),
  ding: () => { tone(880, 0.25, 'sine', 0.15); setTimeout(() => tone(1320, 0.35, 'sine', 0.12), 90); },
  boing: () => tone(260, 0.55, 'sine', 0.25, 900),
  splash: () => noise(0.7, 0.45, 1400),
  thud: () => noise(0.18, 0.5, 280),
  thunder: () => noise(1.4, 0.35, 180),
  squawk: () => { tone(1500, 0.12, 'square', 0.04, 900); setTimeout(() => tone(1400, 0.14, 'square', 0.04, 800), 140); }
};
function setMuteLabel() { $('mute').textContent = muted ? '소리 꺼짐' : '소리 켜짐'; }
setMuteLabel();
$('mute').addEventListener('pointerdown', e => e.stopPropagation());
$('mute').addEventListener('click', () => {
  muted = !muted; setMuteLabel();
  try { localStorage.setItem('gull-mast-muted', muted ? '1' : '0'); } catch (e) {}
  ensureAudio(); if (master) master.gain.value = muted ? 0 : 0.5;
});

// ---- ui helpers ----
function pop(text) { const p = $('pop'); p.textContent = text; p.classList.remove('show'); void p.offsetWidth; p.classList.add('show'); }
function flashPad(s) { const p = $(s < 0 ? 'padL' : 'padR'); p.classList.add('hit'); setTimeout(() => p.classList.remove('hit'), 110); }
function showPlayUI(on) { $('hud').style.opacity = 1; $('pads').style.opacity = on ? 1 : 0; }

// ---- input ----
function tap(s) {
  ensureAudio();
  if (st === 'ready') { st = 'play'; $('intro').hidden = true; }
  if (st !== 'play') return;
  flashPad(s);
  if (s !== lastSide && h < C.MAX_H) { h = Math.min(C.MAX_H, h + C.STEP); sfx.step(); }
  om += s * C.KICK * (1 + h / 28) + (Math.random() - 0.5) * C.JIT;
  lastSide = s; idle = 0; slideV = 0; grab[s < 0 ? 0 : 1] = 1;
  if (gull && gull.phase === 'perch' && s === gull.side) {
    gull.pecks = gull.pecks.filter(x => t - x < 0.45); gull.pecks.push(t);
    if (gull.pecks.length >= 2) { gull.phase = 'out'; gull.k = 0; sfx.squawk(); }
  }
  if (hint > 0 && s === hintSide) hint = 0;
}
cv.addEventListener('pointerdown', e => { e.preventDefault(); tap(e.clientX < W / 2 ? -1 : 1); });
addEventListener('keydown', e => {
  if (e.repeat) return;
  const k = e.key.toLowerCase();
  if (k === 'arrowleft' || k === 'a') { e.preventDefault(); tap(-1); }
  else if (k === 'arrowright' || k === 'd') { e.preventDefault(); tap(1); }
  else if ((k === ' ' || k === 'enter') && st === 'result' && resT > 0.6) { e.preventDefault(); restart(); }
});
$('again').addEventListener('click', () => restart());
function restart() { reset(); st = 'play'; $('res').hidden = true; showPlayUI(true); }

// ---- mast geometry ----
const MAST = C.MAX_H + 2, DS = 0.25;
const mast = [];
function shipPt(lx, ly) { // ship-local (pivot at waterline) -> world
  const c = Math.cos(roll), s = Math.sin(roll);
  return { x: lx * c + ly * s, y: -1 + (-lx * s + ly * c) };
}
function bendAngle(s, Hc) {
  const u = s / Hc;
  return roll + (u <= 1 ? th * Math.pow(u, 1.4) : th * (1 + 0.6 * Math.min((s - Hc) / 10, 1)));
}
function buildMast(len) {
  mast.length = 0;
  const Hc = Math.max(hv + 1, 1.5), b = shipPt(0, 1.1);
  let x = b.x, y = b.y;
  for (let s = 0; s <= len + 1e-6; s += DS) {
    const a = bendAngle(s, Hc);
    mast.push([x, y, a]);
    x += Math.sin(a) * DS; y += Math.cos(a) * DS;
  }
}
function mastAt(s) {
  const fi = s / DS, i = clamp(Math.floor(fi), 0, mast.length - 1), j = Math.min(mast.length - 1, i + 1), f = fi - i;
  const p = mast[i], q = mast[j];
  return { x: p[0] + (q[0] - p[0]) * f, y: p[1] + (q[1] - p[1]) * f, a: p[2] + (q[2] - p[2]) * f };
}
const rotOff = (a, ox, oy) => ({ x: ox * Math.cos(a) + oy * Math.sin(a), y: -ox * Math.sin(a) + oy * Math.cos(a) });

// ---- simulation ----
function simPlay(dt) {
  idle += dt;
  if (idle > C.IDLE && h > 0) { slideV = Math.min(1.5, slideV + dt * 2.2); h = Math.max(0, h - slideV * dt); }
  gustT -= dt;
  if (gustT <= 0) {
    gustT = rand(0.6, 2.2);
    const storm = h > 60 && h < 90 ? 1.6 : 1;
    gustTarget = rand(-1, 1) * clamp((h - 8) / 40, 0, 1) * 1.3 * storm;
  }
  gust += (gustTarget - gust) * Math.min(1, dt * 3);
  const swell = Math.sin(2 * Math.PI * t / SWELL_T) * clamp(0.2 + h / 30, 0.2, 1.3);
  if (!gull && h > 15) {
    gullT -= dt;
    if (gullT <= 0) { gull = { side: Math.random() < 0.5 ? -1 : 1, phase: 'in', k: 0, pecks: [], dur: rand(3, 5) }; sfx.squawk(); }
  }
  const gw = gull && gull.phase === 'perch' ? gull.side * 0.8 * (1 + h / 60) : 0;
  const acc = -stiff(h) * th + topple(h) * Math.sin(th) - C.DAMP * om + swell + gust + gw;
  om += acc * dt; th += om * dt;
  maxH = Math.max(maxH, h);
  if (!hinted && h > 8 && Math.abs(th) > 0.3) { hinted = true; hint = 2.6; hintSide = -Math.sign(th); }
  if (Math.abs(th) > C.FAIL) launch();
}
function launch() {
  const p = mastAt(hv + 1), s = Math.sign(th);
  flyer = { x: p.x, y: p.y, vx: clamp(om * h * 0.35, -40, 40) + s * (3 + 0.18 * h), vy: 2.5 + 0.1 * h,
    rot: p.a, spin: s * rand(5, 9), done: null, end: 0, bounces: 0 };
  st = 'fly'; sfx.boing(); pop('놓쳤다!!'); showPlayUI(false); hint = 0;
  if (gull) { gull.phase = 'out'; gull.k = 0; }
  if (navigator.vibrate) try { navigator.vibrate(40); } catch (e) {}
}
function simFly(dt) {
  const f = flyer;
  dt *= 1.6;
  om += (-12 * th - 2 * om) * dt; th += om * dt;
  if (!f.done) {
    f.vy -= 9.8 * dt; f.vx *= 1 - dt * 0.05;
    f.x += f.vx * dt; f.y += f.vy * dt; f.rot += f.spin * dt;
    if (Math.abs(f.x) < 5 && f.y <= 0.45 && f.vy < 0) {
      f.y = 0.45; sfx.thud(); spray(f.x, 0.3, 10, '#c9a46a');
      if (Math.abs(f.vy) > 4 && f.bounces < 3) { f.vy = -f.vy * 0.3; f.spin *= 0.5; f.vx *= 0.6; f.bounces++; }
      else { f.done = 'deck'; f.vy = 0; }
    } else if (Math.abs(f.x) >= 5 && f.y <= waterAt(f.x)) {
      f.done = 'sea'; sfx.splash(); spray(f.x, waterAt(f.x), 34, '#e8f6ff');
    }
  } else {
    f.end += dt;
    if (f.done === 'sea') { f.y -= dt * 0.7; f.vx *= 1 - dt * 3; f.x += f.vx * dt * 0.2; }
    else { f.vx *= 1 - dt * 4; f.x += f.vx * dt; f.rot += (Math.PI / 2 * Math.sign(f.rot || 1) - f.rot) * Math.min(1, dt * 5); }
    if (f.end > 1.1) finish();
  }
}
function finish() {
  st = 'result'; resT = 0;
  const isBest = maxH > best;
  if (isBest) { best = maxH; try { localStorage.setItem('gull-mast-best', String(best)); } catch (e) {} }
  let r = RANKS[0]; for (const k of RANKS) if (maxH >= k.h) r = k;
  $('rscore').textContent = fmt(maxH);
  $('rtitle').textContent = r.t;
  $('rcom').textContent = r.c;
  $('rfly').textContent = flyer.done === 'deck' ? '갑판에 털썩 떨어짐' : `바다까지 ${fmt(Math.abs(flyer.x))} 날아감`;
  const rb = $('rbest');
  rb.textContent = isBest && maxH > 1 ? '최고 기록 갱신!' : `최고 ${fmt(best)}`;
  rb.className = isBest && maxH > 1 ? 'new' : '';
  $('res').hidden = false;
}
function spray(x, y, n, col) {
  for (let i = 0; i < n; i++) parts.push({ x, y, vx: rand(-3, 3), vy: rand(2, 7), life: rand(0.6, 1.2), col, r: rand(0.05, 0.14) });
}
function updateGull(dt) {
  if (!gull) return;
  gull.k += dt;
  if (gull.phase === 'in' && gull.k > 1.1) { gull.phase = 'perch'; gull.k = 0; }
  else if (gull.phase === 'perch' && gull.k > gull.dur) { gull.phase = 'out'; gull.k = 0; }
  else if (gull.phase === 'out' && gull.k > 1.3) { gull = null; gullT = rand(7, 13); }
}
function step(dt) {
  t += dt;
  roll = 0.045 * Math.sin(2 * Math.PI * t / SWELL_T - 0.6);
  grab[0] = Math.max(0, grab[0] - dt * 5); grab[1] = Math.max(0, grab[1] - dt * 5);
  updateGull(dt);
  for (const p of parts) { p.life -= dt; p.vy -= 9.8 * dt; p.x += p.vx * dt; p.y += p.vy * dt; }
  if (parts.length > 0) parts = parts.filter(p => p.life > 0);
  if (st === 'play') simPlay(dt);
  else if (st === 'fly') simFly(dt);
  else if (st === 'result') { resT += dt; th *= 1 - dt * 2; }
  else { th = 0.02 * Math.sin(t * 1.3); }
  hv += (h - hv) * Math.min(1, dt * 14);
}

// per-frame (not per-substep) events
function frameEvents(dt) {
  if (hint > 0) hint -= dt;
  $('hint').style.opacity = hint > 0 ? 1 : 0;
  $('padL').classList.toggle('want', hint > 0 && hintSide < 0);
  $('padR').classList.toggle('want', hint > 0 && hintSide > 0);
  if (st === 'play') {
    while (zoneIdx + 1 < ZONES.length && maxH >= ZONES[zoneIdx + 1].h) { zoneIdx++; sfx.ding(); pop(ZONES[zoneIdx].name + ' 도착!'); }
    if (!topped && h >= C.MAX_H) { topped = true; sfx.ding(); pop('돛대 꼭대기!'); }
    const a = Math.abs(th);
    if (a > 0.5) { creakT -= dt; if (creakT <= 0) { creakT = 0.55 - a * 0.25; sfx.creak(a); } }
  }
  const alt = camY;
  if (alt > 58 && alt < 92 && st !== 'ready') {
    flashT -= dt;
    if (flashT <= 0) { flashT = rand(3, 8); flash = 1; setTimeout(() => sfx.thunder(), 400); }
  }
  flash = Math.max(0, flash - dt * 2.5);
  let zi = 0; for (let i = 0; i < ZONES.length; i++) if (h >= ZONES[i].h) zi = i;
  const altTxt = fmt(st === 'fly' || st === 'result' ? maxH : h), zTxt = ZONES[zi].name;
  if ($('alt').textContent !== altTxt) $('alt').textContent = altTxt;
  if ($('zone').textContent !== zTxt) $('zone').textContent = zTxt;
  const bTxt = '최고 ' + fmt(Math.max(best, st === 'play' ? maxH : 0));
  if ($('best').textContent !== bTxt) $('best').textContent = bTxt;
}

// ---- rendering ----
const X = x => W / 2 + (x - camX) * ppm;
const Y = y => H / 2 - (y - camY) * ppm;
function waterAt(x) { return -1.2 + 0.16 * Math.sin(x * 0.6 + t * 1.6) + 0.08 * Math.sin(x * 1.7 - t * 2.3); }
const SKY = [
  [0, [121, 195, 230], [211, 240, 247]], [28, [233, 138, 90], [247, 210, 154]], [45, [95, 134, 196], [198, 216, 240]],
  [62, [53, 58, 82], [90, 96, 120]], [88, [14, 29, 61], [29, 61, 94]], [125, [4, 5, 13], [11, 16, 40]]
];
function skyAt(alt) {
  let i = 0; while (i < SKY.length - 2 && alt > SKY[i + 1][0]) i++;
  const a = SKY[i], b = SKY[i + 1], k = clamp((alt - a[0]) / (b[0] - a[0]), 0, 1);
  const mix = (p, q) => `rgb(${p.map((v, j) => Math.round(v + (q[j] - v) * k)).join(',')})`;
  return [mix(a[1], b[1]), mix(a[2], b[2])];
}
function cloud(x, y, s, col) {
  ctx.fillStyle = col; ctx.beginPath();
  const u = s * ppm;
  ctx.ellipse(x, y, u, u * 0.45, 0, 0, 7);
  ctx.ellipse(x - u * 0.6, y + u * 0.1, u * 0.6, u * 0.32, 0, 0, 7);
  ctx.ellipse(x + u * 0.55, y + u * 0.08, u * 0.65, u * 0.35, 0, 0, 7);
  ctx.ellipse(x + u * 0.1, y - u * 0.25, u * 0.5, u * 0.35, 0, 0, 7);
  ctx.fill();
}
function drawSky() {
  const [top, bot] = skyAt(camY);
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, top); g.addColorStop(1, bot);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const sa = clamp((camY - 70) / 25, 0, 1);
  if (sa > 0) {
    for (const s of stars) {
      ctx.globalAlpha = sa * (0.55 + 0.45 * Math.sin(t * 2 + s.p));
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(s.x * W, s.y * H, s.r, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  const aa = clamp((camY - 82) / 14, 0, 1) * clamp((150 - camY) / 25, 0.25, 1);
  if (aa > 0) {
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 3; i++) {
      const y0 = H * 0.22 + i * H * 0.08;
      const g2 = ctx.createLinearGradient(0, y0 - 60, 0, y0 + 90);
      g2.addColorStop(0, 'rgba(80,255,170,0)'); g2.addColorStop(0.4, `rgba(80,255,170,${0.22 * aa})`);
      g2.addColorStop(0.7, `rgba(120,140,255,${0.12 * aa})`); g2.addColorStop(1, 'rgba(120,140,255,0)');
      ctx.fillStyle = g2; ctx.beginPath(); ctx.moveTo(0, y0 + 90);
      for (let x = 0; x <= W; x += 12) ctx.lineTo(x, y0 + Math.sin(x * 0.008 + t * 0.4 + i * 1.7) * 30 + Math.sin(x * 0.021 - t * 0.7) * 12 - 60);
      ctx.lineTo(W, y0 + 90); ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }
  const sun = clamp(1 - Math.abs(camY - 30) / 14, 0, 1);
  if (sun > 0) {
    ctx.globalAlpha = sun; ctx.fillStyle = '#ffb46b';
    ctx.beginPath(); ctx.arc(W * 0.78, H * 0.62, Math.min(W, H) * 0.12, 0, 7); ctx.fill(); ctx.globalAlpha = 1;
  }
}
function drawFar() {
  const ly = Y(-1.2);
  if (ly < H + 40) { // distant lighthouse on the horizon
    const lx = X(-26) * 0.5 + W * 0.05;
    ctx.fillStyle = 'rgba(40,60,90,.55)';
    ctx.beginPath(); ctx.moveTo(lx - 0.5 * ppm, ly); ctx.lineTo(lx - 0.3 * ppm, ly - 4.2 * ppm); ctx.lineTo(lx + 0.3 * ppm, ly - 4.2 * ppm); ctx.lineTo(lx + 0.5 * ppm, ly); ctx.fill();
    ctx.fillStyle = `rgba(255,220,120,${0.5 + 0.5 * Math.max(0, Math.sin(t * 2))})`;
    ctx.fillRect(lx - 0.25 * ppm, ly - 4.7 * ppm, 0.5 * ppm, 0.45 * ppm);
    ctx.fillStyle = 'rgba(70,90,110,.45)';
    ctx.beginPath(); ctx.ellipse(X(30) * 0.5 + W * 0.5, ly, 6 * ppm, 1.2 * ppm, 0, Math.PI, 0); ctx.fill();
  }
  for (const c of clouds) {
    const sx = W / 2 + (c.x - camX * 0.6) * ppm, sy = Y(c.y);
    if (sy < -200 || sy > H + 200) continue;
    cloud(sx, sy, c.s, c.dark ? 'rgba(70,74,96,.85)' : 'rgba(255,255,255,.88)');
  }
}
function drawHull() {
  const p = shipPt(0, 0), u = ppm;
  ctx.save(); ctx.translate(X(p.x), Y(p.y)); ctx.rotate(roll);
  ctx.fillStyle = '#6b2d22';
  ctx.beginPath(); ctx.moveTo(-5.6 * u, -1.6 * u); ctx.lineTo(6.2 * u, -2.2 * u); ctx.lineTo(4.2 * u, 1.7 * u); ctx.lineTo(-4.6 * u, 1.7 * u); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#f4f6fa'; ctx.lineWidth = 0.14 * u;
  ctx.beginPath(); ctx.moveTo(-5.4 * u, -0.6 * u); ctx.lineTo(5.6 * u, -1.05 * u); ctx.stroke();
  ctx.fillStyle = '#2b1712';
  for (const px of [-3, -1, 1, 3]) { ctx.beginPath(); ctx.arc(px * u, -0.15 * u + px * 0.02 * u, 0.18 * u, 0, 7); ctx.fill(); }
  ctx.fillStyle = '#b7894f'; ctx.fillRect(-5.6 * u, -1.75 * u, 11.6 * u, 0.2 * u);
  ctx.restore();
}
function shroud(lx, s) {
  const a = shipPt(lx, 1.1), b = mastAt(s);
  const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2 - 0.25;
  ctx.beginPath(); ctx.moveTo(X(a.x), Y(a.y)); ctx.quadraticCurveTo(X(mx), Y(my), X(b.x), Y(b.y)); ctx.stroke();
}
function drawMast() {
  ctx.strokeStyle = 'rgba(60,40,25,.75)'; ctx.lineWidth = Math.max(1, 0.035 * ppm);
  shroud(-4.4, 8); shroud(4.4, 8); shroud(-2.6, 8); shroud(2.6, 8);
  const top = camY + H / ppm / 2 + 2, bot = camY - H / ppm / 2 - 2;
  ctx.lineCap = 'round';
  for (const pass of [0, 1]) {
    ctx.strokeStyle = pass ? '#a8743f' : '#5e3a1f';
    for (let i = 0; i < mast.length - 1; i++) {
      const p = mast[i], q = mast[i + 1];
      if ((p[1] > top && q[1] > top) || (p[1] < bot && q[1] < bot)) continue;
      const s = i * DS, w = (0.32 - 0.2 * s / MAST) * ppm;
      ctx.lineWidth = pass ? w * 0.6 : w;
      ctx.beginPath(); ctx.moveTo(X(p[0]) - (pass ? w * 0.12 : 0), Y(p[1])); ctx.lineTo(X(q[0]) - (pass ? w * 0.12 : 0), Y(q[1])); ctx.stroke();
    }
  }
  const len = (mast.length - 1) * DS;
  ctx.font = `600 ${Math.round(clamp(ppm * 0.38, 10, 14))}px ${getComputedStyle(document.body).fontFamily}`;
  ctx.textBaseline = 'middle';
  for (let k = 1; 1 + 5 * k <= len; k++) {
    const s = 1 + 5 * k, p = mastAt(s);
    if (p.y > top || p.y < bot) continue;
    const w = (0.32 - 0.2 * s / MAST) * ppm * 0.75;
    ctx.save(); ctx.translate(X(p.x), Y(p.y)); ctx.rotate(p.a);
    ctx.strokeStyle = '#d8b04a'; ctx.lineWidth = Math.max(2, 0.08 * ppm);
    ctx.beginPath(); ctx.moveTo(-w, 0); ctx.lineTo(w, 0); ctx.stroke();
    if (k % 2 === 0 && k !== 4) {
      ctx.fillStyle = 'rgba(19,35,63,.55)'; ctx.fillText(5 * k + 'm', w + 7, 1.5);
      ctx.fillStyle = '#f4f6fa'; ctx.fillText(5 * k + 'm', w + 6, 0);
    }
    ctx.restore();
  }
  // yard with furled sail at 8m
  const yd = mastAt(8);
  ctx.save(); ctx.translate(X(yd.x), Y(yd.y)); ctx.rotate(yd.a);
  ctx.strokeStyle = '#5e3a1f'; ctx.lineWidth = 0.14 * ppm; ctx.beginPath(); ctx.moveTo(-2.6 * ppm, 0); ctx.lineTo(2.6 * ppm, 0); ctx.stroke();
  ctx.strokeStyle = '#efe6d2'; ctx.lineWidth = 0.26 * ppm; ctx.beginPath(); ctx.moveTo(-2.3 * ppm, 0.17 * ppm); ctx.lineTo(2.3 * ppm, 0.17 * ppm); ctx.stroke();
  ctx.strokeStyle = '#c9a46a'; ctx.lineWidth = 0.05 * ppm;
  for (let i = -2; i <= 2; i++) { ctx.beginPath(); ctx.moveTo(i * ppm, 0); ctx.lineTo(i * ppm, 0.32 * ppm); ctx.stroke(); }
  ctx.restore();
  // crow's nest at 20m
  if (len > 22) {
    const cn = mastAt(21);
    ctx.save(); ctx.translate(X(cn.x), Y(cn.y)); ctx.rotate(cn.a);
    ctx.fillStyle = '#7a4a26';
    ctx.beginPath(); ctx.moveTo(-0.95 * ppm, -0.55 * ppm); ctx.lineTo(0.95 * ppm, -0.55 * ppm); ctx.lineTo(0.7 * ppm, 0.3 * ppm); ctx.lineTo(-0.7 * ppm, 0.3 * ppm); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#4a2c16'; ctx.lineWidth = 0.05 * ppm;
    for (let i = 0; i < 3; i++) { const yy = (-0.4 + i * 0.25) * ppm; ctx.beginPath(); ctx.moveTo(-0.9 * ppm, yy); ctx.lineTo(0.9 * ppm, yy); ctx.stroke(); }
    ctx.restore();
  }
  // pennant at the very top
  if (len >= MAST - 0.01) {
    const tp = mastAt(MAST);
    ctx.save(); ctx.translate(X(tp.x), Y(tp.y)); ctx.rotate(tp.a);
    ctx.fillStyle = '#d8432e'; ctx.beginPath(); ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(0.8 * ppm, -0.1 * ppm + Math.sin(t * 6) * 0.15 * ppm, 1.6 * ppm, 0.2 * ppm); ctx.lineTo(0, 0.5 * ppm); ctx.fill();
    ctx.restore();
  }
}
function drawSailor(px, py, a, flail) {
  const u = ppm;
  ctx.save(); ctx.translate(px, py); ctx.rotate(a);
  ctx.lineCap = 'round';
  ctx.strokeStyle = '#1d2c4f'; ctx.lineWidth = 0.14 * u;
  for (const s of [-1, 1]) {
    const kick = flail ? Math.sin(t * 14 + s) * 0.2 : 0;
    ctx.beginPath(); ctx.moveTo(s * 0.1 * u, 0.05 * u); ctx.quadraticCurveTo(s * (0.34 + kick) * u, 0.28 * u, s * 0.12 * u, 0.52 * u); ctx.stroke();
  }
  ctx.fillStyle = '#f4f6fa';
  ctx.beginPath(); ctx.ellipse(0, -0.2 * u, 0.22 * u, 0.3 * u, 0, 0, 7); ctx.fill();
  ctx.save(); ctx.clip();
  ctx.fillStyle = '#1d2c4f';
  for (const yy of [-0.36, -0.22, -0.08]) ctx.fillRect(-0.3 * u, yy * u, 0.6 * u, 0.065 * u);
  ctx.restore();
  for (const s of [-1, 1]) {
    const g = grab[s < 0 ? 0 : 1];
    let hx = s * 0.09 * u, hy = -(0.78 + 0.16 * g) * u;
    if (flail) { hx = s * (0.45 + 0.1 * Math.sin(t * 17 + s)) * u; hy = -0.75 * u + Math.sin(t * 13 * s) * 0.15 * u; }
    ctx.strokeStyle = '#e4e9f1'; ctx.lineWidth = 0.11 * u;
    ctx.beginPath(); ctx.moveTo(s * 0.17 * u, -0.38 * u); ctx.quadraticCurveTo(s * 0.34 * u, -0.6 * u, hx, hy); ctx.stroke();
    ctx.fillStyle = '#f0c39b'; ctx.beginPath(); ctx.arc(hx, hy, 0.075 * u, 0, 7); ctx.fill();
  }
  ctx.fillStyle = '#f0c39b'; ctx.beginPath(); ctx.arc(0, -0.63 * u, 0.17 * u, 0, 7); ctx.fill();
  ctx.fillStyle = '#d8432e'; ctx.beginPath(); ctx.arc(0, -0.66 * u, 0.175 * u, Math.PI * 1.02, Math.PI * 1.98); ctx.fill();
  ctx.beginPath(); ctx.moveTo(0.14 * u, -0.7 * u); ctx.lineTo(0.3 * u, -0.78 * u + Math.sin(t * 9) * 0.03 * u); ctx.lineTo(0.27 * u, -0.64 * u); ctx.fill();
  ctx.fillStyle = '#1d2c4f';
  ctx.beginPath(); ctx.arc(-0.06 * u, -0.66 * u, 0.025 * u, 0, 7); ctx.arc(0.06 * u, -0.66 * u, 0.025 * u, 0, 7); ctx.fill();
  ctx.restore();
}
function drawGullAt(x, y, flap, dir, perched) {
  const u = ppm;
  ctx.save(); ctx.translate(x, y); ctx.scale(dir, 1);
  ctx.strokeStyle = '#8e99a6'; ctx.lineWidth = 0.07 * u; ctx.lineCap = 'round';
  const wy = perched ? 0.02 : Math.sin(flap) * 0.28;
  ctx.beginPath(); ctx.moveTo(-0.02 * u, -0.04 * u); ctx.quadraticCurveTo(-0.18 * u, (-0.12 - wy) * u, -0.38 * u, (-0.05 - wy * 1.4) * u); ctx.stroke();
  ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.ellipse(0, 0, 0.22 * u, 0.11 * u, -0.1, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(0.18 * u, -0.09 * u, 0.085 * u, 0, 7); ctx.fill();
  ctx.fillStyle = '#f2a33a'; ctx.beginPath(); ctx.moveTo(0.25 * u, -0.1 * u); ctx.lineTo(0.37 * u, -0.07 * u); ctx.lineTo(0.25 * u, -0.05 * u); ctx.fill();
  ctx.fillStyle = '#13233f'; ctx.beginPath(); ctx.arc(0.2 * u, -0.11 * u, 0.018 * u, 0, 7); ctx.fill();
  if (!perched) { ctx.strokeStyle = '#8e99a6'; ctx.beginPath(); ctx.moveTo(-0.02 * u, -0.04 * u); ctx.quadraticCurveTo(-0.1 * u, (-0.18 - wy) * u, -0.28 * u, (-0.2 - wy) * u); ctx.stroke(); }
  ctx.restore();
}
function drawGull(cl) {
  if (!gull) return;
  const perch = rotOff(cl.a, gull.side * 0.34, 0.52);
  const px = cl.x + perch.x, py = cl.y + perch.y;
  let x = px, y = py, perched = gull.phase === 'perch';
  if (gull.phase === 'in') { const e = 1 - Math.pow(1 - Math.min(1, gull.k / 1.1), 3); x = px + gull.side * 9 * (1 - e); y = py + 4 * (1 - e); }
  if (gull.phase === 'out') { const e = Math.min(1, gull.k / 1.3); x = px + gull.side * 10 * e * e; y = py + 6 * e; }
  const dir = gull.phase === 'out' ? gull.side : -gull.side;
  drawGullAt(X(x), Y(y), t * 18, dir, perched);
}
function drawSea() {
  const bot = H + 5, y0 = Y(-1.2);
  if (y0 - 0.5 * ppm > bot) return;
  ctx.fillStyle = 'rgba(31,95,134,.93)';
  ctx.beginPath(); ctx.moveTo(0, bot);
  for (let sx = 0; sx <= W + 8; sx += 8) { const wx = camX + (sx - W / 2) / ppm; ctx.lineTo(sx, Y(waterAt(wx))); }
  ctx.lineTo(W, bot); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(232,246,255,.7)'; ctx.lineWidth = 2; ctx.beginPath();
  for (let sx = 0; sx <= W + 8; sx += 8) { const wx = camX + (sx - W / 2) / ppm; const yy = Y(waterAt(wx)); sx ? ctx.lineTo(sx, yy) : ctx.moveTo(sx, yy); }
  ctx.stroke();
  const g = ctx.createLinearGradient(0, y0, 0, y0 + 4 * ppm);
  g.addColorStop(0, 'rgba(18,62,92,0)'); g.addColorStop(1, 'rgba(18,62,92,.9)');
  ctx.fillStyle = g; ctx.fillRect(0, y0, W, bot - y0);
}
function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const viewH = H / ppm;
  buildMast(clamp(hv + 1 + viewH, 25, MAST));
  const cl = mastAt(hv + 1);
  let tx = cl.x * 0.85, ty = cl.y + viewH * 0.12;
  if (flyer) { tx = flyer.x * 0.9; ty = flyer.y + viewH * 0.05; }
  ty = Math.max(ty, viewH / 2 - 3.4);
  const dt = 1 / 60;
  camX += (tx - camX) * Math.min(1, dt * (flyer ? 5 : 4));
  camY += (ty - camY) * Math.min(1, dt * (flyer ? 5 : 4));
  drawSky(); drawFar(); drawHull(); drawMast();
  if (!flyer) drawSailor(X(cl.x), Y(cl.y), cl.a, false);
  drawGull(cl);
  if (flyer) drawSailor(X(flyer.x), Y(flyer.y), flyer.rot, !flyer.done);
  drawSea();
  for (const p of parts) { ctx.globalAlpha = clamp(p.life, 0, 1); ctx.fillStyle = p.col; ctx.beginPath(); ctx.arc(X(p.x), Y(p.y), p.r * ppm, 0, 7); ctx.fill(); }
  ctx.globalAlpha = 1;
  if (flash > 0) { ctx.fillStyle = `rgba(235,240,255,${flash * 0.55})`; ctx.fillRect(0, 0, W, H); }
}

// ---- loop ----
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const n = Math.max(1, Math.ceil(dt * 120));
  for (let i = 0; i < n; i++) step(dt / n);
  frameEvents(dt);
  render();
  requestAnimationFrame(frame);
}
showPlayUI(true);
requestAnimationFrame(frame);
})();
</script>
